# trace's own stacked pull requests (docs/stacked-changes.md "Trace's own development"; CLAUDE.md).
#
# trace's repository is not onboarded with its own harness, so this keeps its stacks in order the same way the
# harness does for projects (src/harness/stack.ts):
#
#   a pull request merged         the open pull requests built on it move to where it went (its base, main) and get
#                                 that branch merged in, so they show only their own commits and run CI on main's code
#   a pull request closed unmerged the ones built on it are told, since they still carry its commits
#   a pull request pushed to      the ones built on it get its new commits merged in
#   a pull request merged into a  a pull request (from stack/carry-<n>) carries its commits on to where that branch
#   branch already merged         went, so they do not miss main (#237)
#
# Merge commits only: nothing is rebased or force-pushed. Pushes are made with the TRACE_TOKEN secret when the
# repository has one, so they start CI; with only GITHUB_TOKEN the stack is still kept in order (GitHub starts no
# workflow for its pushes) and CI runs on the next push to that branch. Kill switch: repository variable
# TRACE_STACK_SYNC = 'false'.
#
# Runners: AWS CodeBuild once `tracectl install` has set TRACE_CODEBUILD_PROJECT, GitHub's ubuntu-24.04 until then,
# as in ci.yml.
name: stack

on:
  pull_request:
    types: [closed, synchronize]

permissions: {}

jobs:
  restack:
    if: vars.TRACE_STACK_SYNC != 'false'
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","restack"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    # one pass per branch at a time: a merge and a push to the same branch never race
    concurrency: { group: 'stack-${{ github.event.pull_request.head.ref }}', cancel-in-progress: false }
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.TRACE_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            // only a branch of this repository can be a base other pull requests build on
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) return core.info('A fork\'s pull request: nothing is built on it here.')
            const own = (p) => p.head.repo?.full_name === `${owner}/${repo}`
            const lines = []
            const say = async () => {
              for (const l of lines) core.info(l)
              if (lines.length) await core.summary.addRaw(lines.map((l) => `- ${l}`).join('\n') + '\n').write()
            }
            // merged into a branch whose own pull request had merged already (#361 into #356's branch, seconds after
            // #356 merged and before this workflow moved it to main): its commits are on a branch nothing merges any
            // more. A pull request carries them on to where that branch went (main, or the first branch up the stack
            // still open), for review and CI like any other. Without it they were lost to main (#237)
            const main = context.payload.repository?.default_branch ?? 'main'
            let dest = pr.base.ref
            if (pr.merged && pr.base.ref !== main) {
              const mergedPr = async (branch) => {
                const open = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100 })).filter(own)
                if (open.length) return null // the branch is still in use
                const done = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', head: `${owner}:${branch}`, per_page: 100 })).filter((p) => own(p) && p.merged_at)
                return done.sort((a, b) => Date.parse(b.merged_at) - Date.parse(a.merged_at))[0] ?? null
              }
              const parent = await mergedPr(pr.base.ref)
              if (parent && (!pr.merged_at || Date.parse(parent.merged_at) <= Date.parse(pr.merged_at))) {
                // up the stack past every branch that has merged too
                let target = parent.base.ref
                for (let i = 0; i < 10 && target !== main; i++) {
                  const up = await mergedPr(target)
                  if (!up) break
                  target = up.base.ref
                }
                dest = target
                const tip = pr.merge_commit_sha ?? pr.head.sha
                const cmp = await github.rest.repos.compareCommits({ owner, repo, base: target, head: tip }).catch(() => null)
                if (cmp && cmp.data.ahead_by === 0) {
                  lines.push(`#${pr.number} merged into \`${pr.base.ref}\` after #${parent.number} had merged, but its commits are on \`${target}\` already.`)
                } else {
                  const branch = `stack/carry-${pr.number}`
                  const made = await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: tip }).then(() => true, (e) => {
                    if (e.status !== 422) throw e
                    return false // there already (a run again)
                  })
                  const existing = made ? [] : await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100 })
                  const carry = existing[0] ?? (await github.rest.pulls.create({ owner, repo, head: branch, base: target,
                    title: `Carry #${pr.number} on to ${target}`,
                    body: `#${pr.number} merged into \`${pr.base.ref}\` after #${parent.number}, the pull request of that branch, had merged into \`${parent.base.ref}\`. So its commits reached no branch that merges on, and would have missed \`${target}\`. This pull request carries them on: review and merge it like #${pr.number}.\n\nOpened by the stack workflow (.github/workflows/stack.yml).`,
                  })).data
                  const marker = `<!-- stack: carried by #${carry.number} -->`
                  const told = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })).some((c) => (c.body ?? '').includes(marker))
                  if (!told) {
                    await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                      body: `This merged into \`${pr.base.ref}\` after #${parent.number} had merged, so its commits did not reach \`${target}\`. #${carry.number} carries them on.\n${marker}` })
                  }
                  lines.push(`#${pr.number} merged into \`${pr.base.ref}\` after #${parent.number} had merged: #${carry.number} carries its commits on to \`${target}\`.`)
                }
              }
            }
            const above = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: pr.head.ref, per_page: 100 })).filter(own)
            // a merged branch GitHub deleted has its pull requests retargeted by GitHub already: the ones on the merged
            // pull request's base that still hold its head commit were built on it, and need its base merged in
            const moved = []
            if (pr.merged) {
              for (const p of (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: pr.base.ref, per_page: 100 })).filter(own)) {
                if (p.number === pr.number || p.head.ref === pr.head.ref) continue
                const cmp = await github.rest.repos.compareCommits({ owner, repo, base: pr.head.sha, head: p.head.sha }).catch(() => null)
                if (cmp && cmp.data.behind_by === 0 && cmp.data.ahead_by > 0) moved.push(p)
              }
            }
            if (!above.length && !moved.length) {
              lines.push(`Nothing is built on #${pr.number}.`)
              return say()
            }
            // merge `from` into the pull request's branch with a merge commit (the merges API: 201 merged, 204 already
            // there, 409 a conflict). Not pulls.updateBranch: GitHub refuses it for a stacked pull request (403)
            const update = async (p, from) => {
              try {
                await github.rest.repos.merge({ owner, repo, base: p.head.ref, head: from, commit_message: `Merge ${from} into ${p.head.ref} (stacked on it)` })
                return true
              } catch (e) {
                if (e.status !== 409) throw e
                return false // a conflict: whoever owns the branch merges it by hand
              }
            }
            for (const p of above) {
              if (context.payload.action === 'synchronize') {
                lines.push(await update(p, pr.head.ref) ? `#${p.number}: merged #${pr.number}'s new commits in.` : `#${p.number} conflicts with #${pr.number}: merge \`${pr.head.ref}\` into \`${p.head.ref}\` by hand.`)
              } else if (pr.merged) {
                // onto where the commits go on: the base, or past a base that had merged already
                await github.rest.pulls.update({ owner, repo, pull_number: p.number, base: dest })
                const done = await update(p, dest)
                lines.push(`#${p.number}: #${pr.number} merged, so it now targets \`${dest}\`${done ? ' and is up to date' : ` (it conflicts there: merge \`${dest}\` into \`${p.head.ref}\` by hand)`}.`)
              } else {
                // once per base: a pull request closed and reopened, then closed again, does not say it twice
                const marker = `<!-- stack: base-closed #${pr.number} -->`
                const said = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: p.number, per_page: 100 })).some((c) => (c.body ?? '').includes(marker))
                if (!said) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: p.number,
                    body: `#${pr.number}, which this is built on, was closed without merging, so this branch still carries its commits. Rebuild it on \`${pr.base.ref}\` without them, or close it. Do not merge it as it is.\n${marker}` })
                }
                lines.push(`#${p.number}: ${said ? 'already told' : 'told'} that #${pr.number} was closed unmerged.`)
              }
            }
            for (const p of moved) {
              lines.push(await update(p, pr.base.ref) ? `#${p.number}: #${pr.number} merged and GitHub moved it onto \`${pr.base.ref}\`; now up to date.` : `#${p.number} conflicts with \`${pr.base.ref}\`: merge it in by hand.`)
            }
            await say()
