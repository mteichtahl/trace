# trace's own build: typecheck, the TypeScript tests (with KiCad, ngspice and Icarus installed so their tests run),
# the Python bridge's tests, and a check that the committed harness bundle matches its source.
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: KiCad 10, ngspice, Icarus Verilog
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad ngspice iverilog poppler-utils
      - name: Python bridge
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e 'python[dev]'
          echo "TRACE_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The harness bundle is up to date
        run: |
          node scripts/bundle-harness.mjs
          git diff --exit-code harness/dist || { echo "harness/dist is stale: run npm run build and commit it"; exit 1; }

  python-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q -e 'python[dev]'
      - run: python -m pytest -q python/tests

  tests-pass:
    name: tests pass
    if: always()
    needs: [typescript, python-bridge]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
