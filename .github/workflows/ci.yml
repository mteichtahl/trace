# trace's own build: typecheck, the TypeScript tests (with KiCad, ngspice and Icarus installed so their tests run),
# the Python bridge's tests, and a check that the committed harness bundle matches its source.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account)
# once `tracectl install` has set it up for this repository, and on GitHub's ubuntu-24.04 runners until then. The switch
# is the repository variable TRACE_CODEBUILD_PROJECT, which the installer sets only once this repository's runner
# project exists (and removes if it does not), exactly as in the workflows it writes for other repositories. Both
# runners are Ubuntu, so the steps work on either: they use sudo, and never assume the job user's name or home.
#
# Keeping the installation up to date: after the tests pass on a push to main, the update-installation job deploys the
# AWS installation again from this commit, with the settings the installer saved (README "Staying up to date"). It runs
# only when the installer has set this repository's TRACE_UPDATE_ROLE, and it signs in to AWS as that role, which only
# this workflow on main can use. Nobody has to run the installer for an update; it is still needed to add repositories
# or people.
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On the project's own machine size (large). An xlarge (36 cores) ran the tests faster but overloaded the machine:
  # vitest starts a fork per core and each Verilator build asks for every core too, so Verilator crashed ("attempted
  # to destroy locked Thread Pool") and the API tests' setup timed out
  typescript:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","typescript"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      # KiCad, ngspice, Icarus, and the verification/FPGA programs, so those tests run instead of skipping.
      APT_PACKAGES: kicad kicad-symbols kicad-footprints ngspice iverilog poppler-utils verilator yosys nextpnr-ice40 nextpnr-ecp5 nextpnr-gowin fpga-icestorm fpga-trellis z3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      # The runner's Ubuntu mirror can be slow (KiCad alone is several hundred MB): keep the downloaded packages.
      # Under the runner's temp directory, not ~: on CodeBuild the job user and its home need not be GitHub's.
      - name: Package cache key
        id: apt
        run: |
          echo "APT_CACHE=$RUNNER_TEMP/apt-cache" >> "$GITHUB_ENV"
          echo "key=apt-${{ runner.os }}-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APT_CACHE }}
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-${{ runner.os }}-
      - name: KiCad 10, ngspice, Icarus Verilog, Verilator, Yosys, nextpnr
        run: |
          mkdir -p "$APT_CACHE/partial"
          export DEBIAN_FRONTEND=noninteractive
          command -v add-apt-repository >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends software-properties-common; }
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$APT_CACHE" $APT_PACKAGES
          # apt leaves the archives root-owned: hand them back to whoever runs this job so actions/cache can save them.
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE" && sudo rm -f "$APT_CACHE/lock"
      - name: Python bridge
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e 'python[dev]' 'cocotb==2.1.0'
          echo "TRACE_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          echo "TRACE_COCOTB_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The web app, the runtimes' start and the harness bundle need neither KiCad nor Python: in a job of their own they
  # run alongside the TypeScript tests instead of after them, which takes about a minute off every run
  web-and-build:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","web-and-build"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      # The deploy installs the web app with npm ci (src/infra/web.ts): a lock file out of step with web/package.json
      # (a Dependabot bump, say) fails here, on the pull request, instead of in update-installation after the merge
      - name: The web app installs, tests and builds
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web test
          npm --prefix web run build
      # Every runtime mode starts from the built entry, as AgentCore starts the image: the API and MCP servers are
      # loaded with a dynamic import() that only the built layout resolves, which no unit test exercises
      - name: The runtimes start
        run: |
          npm run build:image
          node scripts/check-runtime-start.mjs
      - name: The harness bundle is up to date
        run: |
          node scripts/bundle-harness.mjs
          git diff --exit-code harness/dist || { echo "harness/dist is stale: run npm run build and commit it"; exit 1; }

  python-bridge:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","python-bridge"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q -e 'python[dev]'
      - run: python -m pytest -q python/tests

  tests-pass:
    name: tests pass
    if: always()
    needs: [typescript, web-and-build, python-bridge]
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","tests-pass"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done

  update-installation:
    needs: tests-pass
    # a push to main, or the workflow run by hand on main (Actions → ci → Run workflow: e.g. to add a project created in
    # the web app now rather than at the next merge). Either way only on main, which is all the role trusts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TRACE_UPDATE_ROLE != ''
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","update-installation"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # one update at a time: a newer merge waits for the one deploying now instead of cancelling it. GitHub keeps only
    # one waiting run per group, so in a burst of merges the waiting ones cancel each other and the one left may be an
    # older commit's; it therefore deploys main as it is when it starts (every commit on main came through a pull
    # request with this workflow green), so the last merge always reaches the installation
    concurrency:
      group: trace-update-installation
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }
      - name: Say which commit is deployed
        run: echo "deploying main at $(git rev-parse --short HEAD) (this run was started by ${GITHUB_SHA::7})"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_UPDATE_ROLE }}
          aws-region: ${{ vars.TRACE_AWS_REGION }}
          role-session-name: trace-update-installation
      - name: Update the installation
        env:
          TRACE_STACK: ${{ vars.TRACE_STACK }}
          TRACE_AWS_REGION: ${{ vars.TRACE_AWS_REGION }}
        run: node dist/bin.js update-installation
