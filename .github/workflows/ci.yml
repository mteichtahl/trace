# trace's own build: typecheck, the TypeScript tests (with KiCad, ngspice and Icarus installed so their tests run),
# the Python bridge's tests, and a check that the committed harness bundle matches its source.
#
# Runs on AWS: with the repository variable TRACE_CODEBUILD_PROJECT (set by `trace install` when this repository is a
# project or in runners.extraRepos), every job runs on that CodeBuild-hosted runner (aws/codebuild/standard:8.0,
# Ubuntu 24.04, as root); without it, on GitHub's ubuntu-24.04. The `runs-on` expression is src/core/onboard.ts RUNS_ON.
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && format('codebuild-{0}-{1}-{2}', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      # KiCad, ngspice, Icarus, and the verification/FPGA programs, so those tests run instead of skipping.
      APT_PACKAGES: kicad kicad-symbols kicad-footprints ngspice iverilog poppler-utils verilator yosys nextpnr-ice40 nextpnr-ecp5 nextpnr-gowin fpga-icestorm fpga-trellis z3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      # The runner's Ubuntu mirror can be slow (KiCad alone is several hundred MB): keep the downloaded packages.
      - name: Package cache key
        id: apt
        run: echo "key=apt-${{ runner.os }}-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-${{ runner.os }}-
      - name: KiCad 10, ngspice, Icarus Verilog, Verilator, Yosys, nextpnr
        run: |
          # GitHub's runner has sudo; a CodeBuild runner runs as root and may not
          SUDO="$(command -v sudo || true)"
          mkdir -p ~/apt-cache/partial
          command -v add-apt-repository >/dev/null || { $SUDO apt-get update -q && $SUDO apt-get install -y -q --no-install-recommends software-properties-common; }
          $SUDO add-apt-repository -y ppa:kicad/kicad-10.0-releases
          $SUDO apt-get update -q
          $SUDO apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" $APT_PACKAGES
          $SUDO chown -R "$(id -un)" ~/apt-cache && rm -f ~/apt-cache/lock
      - name: Python bridge
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e 'python[dev]' 'cocotb==2.1.0'
          echo "TRACE_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          echo "TRACE_COCOTB_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The harness bundle is up to date
        run: |
          node scripts/bundle-harness.mjs
          git diff --exit-code harness/dist || { echo "harness/dist is stale: run npm run build and commit it"; exit 1; }

  python-bridge:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && format('codebuild-{0}-{1}-{2}', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q -e 'python[dev]'
      - run: python -m pytest -q python/tests

  tests-pass:
    name: tests pass
    if: always()
    needs: [typescript, python-bridge]
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && format('codebuild-{0}-{1}-{2}', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
