# Dependabot for trace (a GitHub configuration file; the only YAML besides workflows and actions).
#
# Why this exists (October 2026): every security-update run for the transitive packages below failed with
# security_update_not_possible, because no fixed version can be reached through the packages that pin them:
#
#   - @opentelemetry/instrumentation-* and @opentelemetry/propagator-jaeger come only through
#     @aws/aws-distro-opentelemetry-node-autoinstrumentation 0.13.0 (the newest ADOT), which pins
#     @opentelemetry/auto-instrumentations-node 0.77.0 exactly. The only "fix" Dependabot finds downgrades ADOT to
#     0.8.1. They are ignored below until ADOT releases a version past them; then delete the ignore entries.
#     (trace loads none of those database and messaging instrumentations' libraries: no pg, mysql, mongoose,
#     oracledb, tedious, cassandra or knex.)
#   - The same pin is why `npm ci` still prints three deprecation warnings (sdk-trace-base, sdk-trace-node and
#     propagator-jaeger, all 2.8.0): OpenTelemetry JS 3 replaced them with @opentelemetry/sdk-trace and dropped the
#     Jaeger propagator, and ADOT 0.13.0 has not moved to 3 yet. package.json "overrides" collapses ADOT's copies to one
#     each (keep them equal to ADOT's pinned version), and trace's own code uses @opentelemetry/sdk-trace. When ADOT
#     moves to OpenTelemetry 3, delete those two overrides and the warnings go with them.
#     The other warnings were fixed at the source: glob 10 (overridden through rimraf 6, which gaxios lists but never
#     loads), node-domexception (replaced by @nolyfill/domexception, Node's own DOMException) and the
#     @types/libsodium-wrappers stub (libsodium-wrappers ships its own types).
#   - undici 5 and @fastify/busboy 2 came only through @actions/core and @actions/github, development dependencies
#     nothing imported. They were removed, which removes both packages from the lockfile.
#
# Version updates are grouped so a release of the AWS SDK or OpenTelemetry is one pull request, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*', '@smithy/*', 'aws-cdk', 'aws-cdk-lib', 'constructs']
      opentelemetry:
        patterns: ['@opentelemetry/*', '@aws/aws-distro-opentelemetry-*']
      development:
        dependency-type: development
      # security fixes for the same families land together too
      aws-sdk-security:
        applies-to: security-updates
        patterns: ['@aws-sdk/*', '@smithy/*']
      opentelemetry-security:
        applies-to: security-updates
        patterns: ['@opentelemetry/*', '@aws/aws-distro-opentelemetry-*']
    ignore:
      # transitive through ADOT 0.13.0, which pins them: no reachable fix (see above)
      - dependency-name: '@opentelemetry/instrumentation-*'
      - dependency-name: '@opentelemetry/propagator-jaeger'
      # pinned on purpose in package.json (exact versions the image and the tests are built against)
      - dependency-name: '@opentelemetry/api'
        update-types: ['version-update:semver-major']
      - dependency-name: pdfjs-dist
        update-types: ['version-update:semver-major']
      # trace runs on Node 22 (package.json engines): types for a later Node would allow APIs it lacks
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directories: ['/', '/harness/actions/install', '/harness/actions/run']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
