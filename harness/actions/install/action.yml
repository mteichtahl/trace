name: trace install
description: >-
  Installs the trace toolkit (the `tracectl` CLI, its MCP server and the Python bridge) from this action's own copy of the
  repository, so a workflow in another repository gets it without a token for the trace repository, and returns an MCP
  config that gives Claude Code the electronics tools.
inputs:
  hardware:
    description: "'true' lets the tools drive instruments, buses and targets (only on a runner wired to hardware)."
    required: false
    default: 'false'
  bridge:
    description: Python bridge extras to install (pdf, visa, can, all, or none).
    required: false
    default: pdf
  tools:
    description: >-
      The only trace tools (registry names, comma-separated) the mcp-config server offers (TRACE_MCP_TOOLS): a
      specialist's allowlist (worker-prompt's `tools`). Empty offers every tool. mcp-config-worker is never limited.
    required: false
    default: ''
  memory-id:
    description: The project's AgentCore memory (vars.TRACE_MEMORY_ID) for the memory_recall/memory_remember tools; empty leaves them out.
    required: false
    default: ''
  kb-id:
    description: The project's knowledge base (vars.TRACE_KB_ID) for kb_search and kb_status (and kb_sync in mcp-config-worker); empty leaves them out.
    required: false
    default: ''
  kb-data-source-id:
    description: Its data source (vars.TRACE_KB_DATA_SOURCE_ID), for kb_status and the worker's kb_sync.
    required: false
    default: ''
  memory-actor:
    description: The memory actor of mcp-config's session (worker-prompt's `memory-actor`, the specialist's).
    required: false
    default: ''
  worker-memory-actor:
    description: The memory actor of mcp-config-worker's session (worker-prompt's `worker-memory-actor`).
    required: false
    default: ''
  memory-session:
    description: The memory session both act in (worker-prompt's `memory-session`).
    required: false
    default: ''
outputs:
  mcp-config:
    description: The MCP config, as JSON text, for Claude Code's --mcp-config (limited to `tools` when given).
    value: ${{ steps.install.outputs.mcp }}
  mcp-config-worker:
    description: The same server for the worker step, with every tool and the worker's memory actor.
    value: ${{ steps.install.outputs.mcp-worker }}
runs:
  using: composite
  steps:
    # node:sqlite needs Node 22.13 or later; the runner's default Node is older.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - id: install
      shell: bash
      env:
        AP: ${{ github.action_path }}
        HARDWARE: ${{ inputs.hardware }}
        BRIDGE: ${{ inputs.bridge }}
        TOOLS: ${{ inputs.tools }}
        MEMORY_ID: ${{ inputs.memory-id }}
        MEMORY_ACTOR: ${{ inputs.memory-actor }}
        WORKER_MEMORY_ACTOR: ${{ inputs.worker-memory-actor }}
        MEMORY_SESSION: ${{ inputs.memory-session }}
        KB_ID: ${{ inputs.kb-id }}
        KB_DATA_SOURCE_ID: ${{ inputs.kb-data-source-id }}
      run: |
        set -euo pipefail
        root="$(cd "$AP/../../.." && pwd)"
        (cd "$root" && npm ci --no-audit --no-fund --loglevel=error && npm run build --silent)
        mkdir -p "$RUNNER_TEMP/trace-bin"
        printf '#!/usr/bin/env bash\nexec node "%s/dist/bin.js" "$@"\n' "$root" > "$RUNNER_TEMP/trace-bin/tracectl"
        chmod +x "$RUNNER_TEMP/trace-bin/tracectl"
        # `trace` too, for workflows rendered before the command was renamed (they call `trace kb sync`, `trace check`)
        ln -sf tracectl "$RUNNER_TEMP/trace-bin/trace"
        echo "$RUNNER_TEMP/trace-bin" >> "$GITHUB_PATH"
        if [ "$BRIDGE" != "none" ]; then
          python3 -m venv "$RUNNER_TEMP/trace-py"
          "$RUNNER_TEMP/trace-py/bin/pip" install -q "$root/python[$BRIDGE]"
          echo "TRACE_PYTHON=$RUNNER_TEMP/trace-py/bin/python" >> "$GITHUB_ENV"
        fi
        git config --global merge.trace-db.driver "tracectl db merge %O %A %B"
        # Built with node from the environment (no shell quoting of the values): TRACE_MCP_TOOLS limits the server to
        # the specialist's tools; the memory tools act as the given actor and session only.
        TRACE_BIN="$RUNNER_TEMP/trace-bin/tracectl" node -e '
          const e = process.env
          const config = (extra) => JSON.stringify({ mcpServers: { trace: { command: e.TRACE_BIN, args: ["mcp"], env: {
            TRACE_HARDWARE: e.HARDWARE === "true" ? "1" : "0",
            ...(e.MEMORY_ID ? { TRACE_MEMORY_ID: e.MEMORY_ID, ...(e.MEMORY_SESSION ? { TRACE_MEMORY_SESSION: e.MEMORY_SESSION } : {}) } : {}),
            ...(e.AWS_REGION ? { AWS_REGION: e.AWS_REGION } : {}),
            ...(e.KB_ID ? { TRACE_KB_ID: e.KB_ID, ...(e.KB_DATA_SOURCE_ID ? { TRACE_KB_DATA_SOURCE_ID: e.KB_DATA_SOURCE_ID } : {}) } : {}),
            ...extra,
          } } } })
          const memory = (actor) => (e.MEMORY_ID && actor ? { TRACE_MEMORY_ACTOR: actor } : {})
          const out = [
            "mcp=" + config({ ...(e.TOOLS ? { TRACE_MCP_TOOLS: e.TOOLS } : {}), ...memory(e.MEMORY_ACTOR) }),
            "mcp-worker=" + config(memory(e.WORKER_MEMORY_ACTOR)),
          ]
          require("fs").appendFileSync(e.GITHUB_OUTPUT, out.join("\n") + "\n")
        '
        "$RUNNER_TEMP/trace-bin/tracectl" tools | tail -n 1
