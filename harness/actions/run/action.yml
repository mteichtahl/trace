name: trace
description: >-
  Runs one trace task (open-pr, automerge, update-queue, ci-doctor, worker-pick, worker-prompt, worker-delegate, worker-report, worker-dispatch, deploy-*) with the repository's settings (.trace/project.db on the default branch).
inputs:
  task:
    description: The task to run.
    required: true
  token:
    description: TRACE_TOKEN, a fine-grained token whose pushes, merges and PRs start workflows. May be empty (the task then degrades and says so).
    required: false
    default: ''
  job-token:
    description: The job's GITHUB_TOKEN (used to read the settings, the Checks API, and as the fallback).
    required: false
    default: ${{ github.token }}
  item:
    description: worker-prompt/worker-dispatch only — one item from worker-pick, as JSON.
    required: false
    default: ''
  agent:
    description: worker-prompt/worker-delegate/worker-report/worker-dispatch only — the specialist (verify, impl, ams, emc, render) that takes the item; default the one worker-pick routed it to.
    required: false
    default: ''
  hardware:
    description: worker-prompt/worker-delegate only — 'true' when this runner is wired to hardware (the specialist then gets its hardware tools).
    required: false
    default: 'false'
  memory-id:
    description: worker-* only — the project's AgentCore memory (vars.TRACE_MEMORY_ID); empty runs without memory. Needs the step's AWS credentials.
    required: false
    default: ''
  specialist:
    description: worker-delegate/worker-report only — the specialist step's structured_output (JSON).
    required: false
    default: ''
  check:
    description: worker-report only — the check step's structured_output (JSON).
    required: false
    default: ''
  worker-conclusion:
    description: worker-report only — the worker step's conclusion (success or failure).
    required: false
    default: ''
  execution-file:
    description: worker-delegate/worker-report only — the last Claude step's execution_file (its transcript; key tool outcomes are remembered).
    required: false
    default: ''
  worker-execution-file:
    description: worker-report only — a copy of the worker step's execution_file.
    required: false
    default: ''
  runtime-arn:
    description: worker-dispatch only — the trace agent's AgentCore runtime ARN (TRACE_AGENT_RUNTIME_ARN).
    required: false
    default: ''
  sha:
    description: deploy-* only — the commit being deployed.
    required: false
    default: ''
  issue:
    description: deploy-* only — the deploy request issue number.
    required: false
    default: ''
  by:
    description: deploy-* only — who approved.
    required: false
    default: ''
  status:
    description: deploy-* only — the deploy job status.
    required: false
    default: ''
  guard:
    description: deploy-* only — the guard step's outcome.
    required: false
    default: ''
  held:
    description: deploy-* only — 'true' when the risk check held the deploy.
    required: false
    default: ''
  rollback-to:
    description: deploy-* only — the commit being rolled back to.
    required: false
    default: ''
  reasons:
    description: deploy-* only — the risk check's reasons.
    required: false
    default: ''
  agent-login:
    description: The GitHub login the trace agents act as (vars.TRACE_AGENT_LOGIN) — never allowed to approve a deploy; the only author (besides github-actions) whose claim markers count.
    required: false
    default: ''
  triggering-actor:
    description: deploy-* only — github.triggering_actor.
    required: false
    default: ''
outputs:
  go: { description: deploy-request/approve — 'true' to deploy, value: '${{ steps.run.outputs.go }}' }
  sha: { description: deploy-request/approve — the commit to deploy, value: '${{ steps.run.outputs.sha }}' }
  issue: { description: deploy-request/approve — the request issue, value: '${{ steps.run.outputs.issue }}' }
  by: { description: deploy-approve — who approved, value: '${{ steps.run.outputs.by }}' }
  before: { description: deploy-guard — what was deployed before (the rollback target), value: '${{ steps.run.outputs.before }}' }
  items: { description: worker-pick — the claimed items as a JSON list, value: '${{ steps.run.outputs.items }}' }
  runner: { description: worker-pick — where items run (worker.runner — agentcore or actions), value: '${{ steps.run.outputs.runner }}' }
  job: { description: worker-dispatch — the agent's job id, value: '${{ steps.run.outputs.job }}' }
  trace: { description: worker-dispatch — the trace id the agent's work continues, value: '${{ steps.run.outputs.trace }}' }
  prompt: { description: worker-prompt — the specialist's prompt; worker-delegate — the worker's, value: '${{ steps.run.outputs.prompt }}' }
  agent: { description: worker-prompt — the specialist the prompt is for, value: '${{ steps.run.outputs.agent }}' }
  args: { description: worker-prompt — the specialist's claude_args (read only, structured output); worker-delegate — the worker's, value: '${{ steps.run.outputs.args }}' }
  tools: { description: worker-prompt — the specialist's trace tools (TRACE_MCP_TOOLS for the install action), value: '${{ steps.run.outputs.tools }}' }
  memory-actor: { description: worker-prompt — the specialist's memory actor, value: '${{ steps.run.outputs.memory-actor }}' }
  worker-memory-actor: { description: worker-prompt — the worker's memory actor, value: '${{ steps.run.outputs.worker-memory-actor }}' }
  memory-session: { description: worker-prompt — the memory session (pr-<n> or issue-<n>), value: '${{ steps.run.outputs.memory-session }}' }
  delegate: { description: worker-delegate — 'true' when the specialist delegated to the worker, value: '${{ steps.run.outputs.delegate }}' }
  check-prompt: { description: worker-delegate — the check's prompt (the specialist again), value: '${{ steps.run.outputs.check-prompt }}' }
  check-args: { description: worker-delegate — the check's claude_args (read only), value: '${{ steps.run.outputs.check-args }}' }
  setup: { description: worker-prompt/deploy-commands — the setup command, value: '${{ steps.run.outputs.setup }}' }
  risk_check: { description: deploy-commands, value: '${{ steps.run.outputs.risk_check }}' }
  command: { description: deploy-commands, value: '${{ steps.run.outputs.command }}' }
  smoke: { description: deploy-commands, value: '${{ steps.run.outputs.smoke }}' }
  rollback: { description: deploy-commands, value: '${{ steps.run.outputs.rollback }}' }
  enabled: { description: deploy-commands, value: '${{ steps.run.outputs.enabled }}' }
runs:
  using: composite
  steps:
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        AP: ${{ github.action_path }}
        TRACE_TASK: ${{ inputs.task }}
        OWN_TOKEN: ${{ inputs.token }}
        JOB_TOKEN: ${{ inputs.job-token }}
        ITEM: ${{ inputs.item }}
        AGENT: ${{ inputs.agent }}
        HARDWARE: ${{ inputs.hardware }}
        MEMORY_ID: ${{ inputs.memory-id }}
        SPECIALIST: ${{ inputs.specialist }}
        CHECK: ${{ inputs.check }}
        WORKER_CONCLUSION: ${{ inputs.worker-conclusion }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        WORKER_EXECUTION_FILE: ${{ inputs.worker-execution-file }}
        TRACE_AGENT_RUNTIME_ARN: ${{ inputs.runtime-arn }}
        SHA: ${{ inputs.sha }}
        ISSUE: ${{ inputs.issue }}
        BY: ${{ inputs.by }}
        STATUS: ${{ inputs.status }}
        GUARD: ${{ inputs.guard }}
        HELD: ${{ inputs.held }}
        ROLLBACK: ${{ inputs.rollback-to }}
        REASONS: ${{ inputs.reasons }}
        TRIGGERING_ACTOR: ${{ inputs.triggering-actor }}
        AGENT_LOGIN: ${{ inputs.agent-login }}
      with:
        github-token: ${{ inputs.token || inputs.job-token }}
        script: |
          const { run } = require(`${process.env.AP}/../../dist/index.cjs`)
          await run({ github, context, core, getOctokit })
