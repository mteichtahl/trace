[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

# The Python bridge: only what Node has no maintained equivalent for, called from TypeScript (src/core/bridge.ts).
#   pdf  — reading tables and vector figures out of datasheet PDFs (pdfplumber, pypdf)
#   visa — instruments over VXI-11, HiSLIP, USBTMC and GPIB (pyvisa, pyvisa-py)
#   can  — CAN through vendor interfaces (PCAN, Kvaser, Vector, gs_usb, SocketCAN) and BLF/ASC logs (python-can)
[project]
name = "tracebridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "pypdf>=4"]
visa = ["pyvisa>=1.14", "pyvisa-py>=0.7", "pyserial>=3.5"]
can = ["python-can>=4.3"]
all = ["tracebridge[pdf,visa,can]"]
dev = ["pytest>=8", "reportlab>=4", "tracebridge[all]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracebridge*"]
