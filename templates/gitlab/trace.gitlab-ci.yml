# trace — pipelines for a project on trace's GitLab (generated by `tracectl onboard`; re-generate with
# `tracectl onboard --refresh`). The same work as the GitHub workflows (trace-prs), done by the same harness code
# (src/harness/gitlab.ts), with GitLab answering (docs/gitlab-projects.md):
#
#   open-pr       a pushed branch gets its merge request; a branch built on another open change's branch is stacked on
#                 it (its merge request targets that branch: docs/stacked-changes.md)
#   automerge     every change to __TR_BRANCH__ is held (label __TR_HOLD__) or left for trace to merge once its checks
#                 pass; only trace's API merges (the agents' token is a Developer's: the branch is protected)
#   update-queue  stacks kept in order, trace's own changes brought up to date; one at a time (resource_group), on a
#                 push to __TR_BRANCH__ and, as a safety net, on the project's schedule
#   ci-doctor     the build's last stage: a failure re-run once if it was flaky, else the change labelled red or an
#                 agent-fix issue opened; a pass clears both (kill switch: TRACE_CI = 'false')
#   worker        the work waiting for the agents picked and handed to the project's AgentCore runtime, one item after
#                 another, as the project's own AWS role (GitLab's ID token, its default branch only); on a push to
#                 __TR_BRANCH__, on the schedule, and when trace asks (kill switch: TRACE_WORKER = 'false')
#   deploy        a push to __TR_BRANCH__ whose build passed asks for a deploy to __TR_ENVIRONMENT__ (automatic, or
#                 approved by a person in trace); an approval or roll back given in trace runs it; the commands get the
#                 deploy role (TRACE_DEPLOY_AWS_ROLE) and the project's variables, never trace's credentials
#                 (src/harness/gitlab-deploy.ts; kill switch: TRACE_DEPLOY = 'false')
#
# The project's own build lives in .gitlab/build.yml, included when it is there (its jobs run before ci-doctor).
#
# Who it acts as: the project's agents (TRACE_GITLAB_TOKEN, the project's own `trace-agents` token, kept current by
# trace's rotation). Kill switch: the project variable TRACE_PRS = 'false'.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitLab runner in the installation's AWS account), named
# by its tag; a job waits until the installer has set the runner up.

include:
  - local: .gitlab/build.yml
    rules:
      - exists: [.gitlab/build.yml]

variables:
  TRACE_SOURCE: "__TR_SOURCE__"
  TRACE_REF: "__TR_REF__"
  TRACE_REPOSITORY: "__TR_REPOSITORY__"

workflow:
  name: "$TRACE_PIPELINE"
  rules:
    - if: $TRACE_WORKFLOW
      variables: { TRACE_PIPELINE: "$TRACE_WORKFLOW" }
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: { TRACE_PIPELINE: "trace-prs" }
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: { TRACE_PIPELINE: "trace-prs" }
    - if: $CI_COMMIT_BRANCH
      variables: { TRACE_PIPELINE: "trace-prs" }

.trace:
  tags: ["codebuild-__TR_RUNNER__-$CI_PROJECT_ID-$CI_PIPELINE_IID-$CI_JOB_NAME"]
  timeout: 10 minutes
  interruptible: false
  script:
    # the harness at trace's ref (the same bundle every project runs), then the task
    - >-
      node -e "fetch('https://raw.githubusercontent.com/'+process.env.TRACE_SOURCE+'/'+process.env.TRACE_REF+'/harness/dist/gitlab.cjs')
      .then(r=>{if(!r.ok)throw new Error('the harness: '+r.status);return r.text()})
      .then(t=>require('fs').writeFileSync('/tmp/trace-harness.cjs',t))"
    - node /tmp/trace-harness.cjs

open-pr:
  extends: .trace
  variables: { TRACE_TASK: open-pr }
  rules:
    - if: $TRACE_PRS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "__TR_BRANCH__"

automerge:
  extends: .trace
  variables: { TRACE_TASK: automerge }
  rules:
    - if: $TRACE_PRS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "__TR_BRANCH__"

update-queue:
  extends: .trace
  variables: { TRACE_TASK: update-queue }
  resource_group: trace-update-queue
  rules:
    - if: $TRACE_PRS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "__TR_BRANCH__"
    - if: $CI_PIPELINE_SOURCE == "schedule"

ci-doctor:
  extends: .trace
  stage: .post
  variables: { TRACE_TASK: ci-doctor }
  rules:
    - if: $TRACE_CI == "false"
      when: never
    - if: $TRACE_WORKFLOW
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: always

worker:
  extends: .trace
  variables: { TRACE_TASK: worker }
  timeout: 30 minutes
  resource_group: trace-worker
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: $TRACE_WORKER == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "__TR_BRANCH__"
    - if: $TRACE_WORKFLOW == "trace-worker"
  script:
    # the project's own AWS role, with GitLab's ID token (its trust names this project's path and default branch)
    - >-
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$TRACE_AWS_ROLE" --role-session-name "trace-worker-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_ID_TOKEN" --duration-seconds 3600 --region "$TRACE_AWS_REGION"
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text))
    - export AWS_REGION="$TRACE_AWS_REGION"
    - >-
      node -e "fetch('https://raw.githubusercontent.com/'+process.env.TRACE_SOURCE+'/'+process.env.TRACE_REF+'/harness/dist/gitlab.cjs')
      .then(r=>{if(!r.ok)throw new Error('the harness: '+r.status);return r.text()})
      .then(t=>require('fs').writeFileSync('/tmp/trace-harness.cjs',t))"
    - node /tmp/trace-harness.cjs


deploy:
  extends: .trace
  stage: deploy
  variables: { TRACE_TASK: deploy, TRACE_DEPLOY_ENVIRONMENT: "__TR_ENVIRONMENT__" }
  timeout: 2 hours
  resource_group: trace-deploy-__TR_ENVIRONMENT__
  environment: { name: "__TR_ENVIRONMENT__" }
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: $TRACE_DEPLOY == "false"
      when: never
    - if: $TRACE_WORKFLOW == "trace-deploy" && $TRACE_INPUT_APPROVAL
    - if: $TRACE_WORKFLOW
      when: never
    # the build passed on the default branch (its jobs are earlier stages): a deploy is requested
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "__TR_BRANCH__"
  script:
    # the project's own trace role (reading an approval given in trace); the commands never get it
    - >-
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$TRACE_AWS_ROLE" --role-session-name "trace-deploy-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_ID_TOKEN" --duration-seconds 3600 --region "$TRACE_AWS_REGION"
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text))
    - export AWS_REGION="$TRACE_AWS_REGION"
    - >-
      node -e "fetch('https://raw.githubusercontent.com/'+process.env.TRACE_SOURCE+'/'+process.env.TRACE_REF+'/harness/dist/gitlab.cjs')
      .then(r=>{if(!r.ok)throw new Error('the harness: '+r.status);return r.text()})
      .then(t=>require('fs').writeFileSync('/tmp/trace-harness.cjs',t))"
    - node /tmp/trace-harness.cjs
