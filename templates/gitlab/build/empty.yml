# The build on trace's GitLab, generated by trace for a project that had none (included by .gitlab-ci.yml). Add your
# own jobs in the build stage: trace's ci-doctor runs after them, and a change merges once they pass.
check:
  stage: build
  tags: ["codebuild-__TR_RUNNER__-$CI_PROJECT_ID-$CI_PIPELINE_IID-$CI_JOB_NAME"]
  timeout: 30 minutes
  rules:
    - if: $TRACE_WORKFLOW
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "__TR_BRANCH__"
  script:
    - echo "Add the project's build and tests here."
