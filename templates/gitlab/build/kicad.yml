# The build on trace's GitLab (hardware: KiCad and firmware), generated by trace (included by .gitlab-ci.yml).
# trace's ci-doctor runs after it, and a change merges once it passes.
check:
  stage: build
  tags: ["codebuild-__TR_RUNNER__-$CI_PROJECT_ID-$CI_PIPELINE_IID-$CI_JOB_NAME"]
  timeout: 45 minutes
  rules:
    - if: $TRACE_WORKFLOW
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "__TR_BRANCH__"
  script:
    # KiCad, ngspice and Icarus Verilog, from the KiCad PPA, as the GitHub build installs them
    - |
      set -euo pipefail
      . /etc/os-release
      KEY=FDA854F61C4D0D9572BB95E5245D5502FAD7A805
      install -d -m 0755 /etc/apt/keyrings
      for i in 1 2 3; do
        curl -fsSL --max-time 30 "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$KEY" -o /tmp/kicad.asc && break
        [ "$i" = 3 ] && { echo "could not fetch the KiCad PPA's key"; exit 1; }; sleep 10
      done
      gpg --dearmor --yes -o /etc/apt/keyrings/kicad.gpg /tmp/kicad.asc
      echo "deb [signed-by=/etc/apt/keyrings/kicad.gpg] https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu $VERSION_CODENAME main" > /etc/apt/sources.list.d/kicad.list
      apt-get update -q && apt-get install -y -q --no-install-recommends kicad ngspice iverilog
    # tracectl at trace's ref, as the GitHub build's install action makes it
    - |
      set -euo pipefail
      git clone -q --depth 1 --branch "$TRACE_REF" "https://github.com/$TRACE_SOURCE" /tmp/trace
      (cd /tmp/trace && npm ci --no-audit --no-fund --loglevel=error && npm run build --silent)
      printf '#!/usr/bin/env bash\nexec node /tmp/trace/dist/bin.js "$@"\n' > /usr/local/bin/tracectl && chmod +x /usr/local/bin/tracectl
      python3 -m venv /tmp/trace-py && /tmp/trace-py/bin/pip install -q "/tmp/trace/python[pdf]"
      git config --global merge.trace-db.driver "tracectl db merge %O %A %B"
    - if [ -f mechanical/case.json ]; then /tmp/trace-py/bin/python -m pip install -q "build123d==0.13.0"; fi
    - TRACE_PYTHON=/tmp/trace-py/bin/python TRACE_CHECK_MECH=1 tracectl check
