# The build on trace's GitLab (Python), generated by trace (included by .gitlab-ci.yml). trace's ci-doctor runs
# after it, and a change merges once it passes.
check:
  stage: build
  tags: ["codebuild-__TR_RUNNER__-$CI_PROJECT_ID-$CI_PIPELINE_IID-$CI_JOB_NAME"]
  timeout: 30 minutes
  rules:
    - if: $TRACE_WORKFLOW
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "__TR_BRANCH__"
  script:
    - python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
    - pip install -e '.[dev]' || pip install -e . pytest
    - python -m pytest -q
