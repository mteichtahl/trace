# The build on trace's GitLab (Rust), generated by trace (included by .gitlab-ci.yml). trace's ci-doctor runs after
# it, and a change merges once it passes.
check:
  stage: build
  tags: ["codebuild-__TR_RUNNER__-$CI_PROJECT_ID-$CI_PIPELINE_IID-$CI_JOB_NAME"]
  timeout: 45 minutes
  rules:
    - if: $TRACE_WORKFLOW
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "__TR_BRANCH__"
  script:
    - command -v rustup >/dev/null || (curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal && . "$HOME/.cargo/env")
    - rustup show && rustup component add clippy rustfmt
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test --all
