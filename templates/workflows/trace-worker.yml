# trace — the event-driven worker (generated by `trace onboard`).
#
# Claude Code picks up work the moment it appears: PRs labelled __TR_CI_RED__, PRs in conflict with __TR_BRANCH__, and
# issues labelled __TR_AGENT_FIX__. Each item is claimed and routed to one specialist agent (verify, impl, ams, emc, thermal,
# render: an agent:<kind> label first, then the failing checks and changed files, then keywords; the runtime asks the
# model when none decides), which investigates with its own tools and hands repository changes to the worker; the
# push starts the build. The repository's .trace/rules.md is the authority on what to do and when to ask a person;
# the guardrails in the prompt (no pushes to __TR_BRANCH__, no merges, no deploys, no settings) are built in.
#
# Where each item runs is the setting worker.runner:
#   - agentcore (default): the item is dispatched to the trace agent on Amazon Bedrock AgentCore Runtime. Needs the
#     repository variables TRACE_AWS_ROLE (this repository's own role, which GitHub OIDC can assume from __TR_BRANCH__
#     only, allowed bedrock-agentcore:InvokeAgentRuntime on this project's runtime alone), TRACE_AWS_REGION and
#     TRACE_AGENT_RUNTIME_ARN (this project's worker runtime). `trace install` sets both per repository.
#   - actions: Claude Code runs here in GitHub Actions (claude-code-action), in steps: the specialist (read only),
#     then, when it delegates, the worker (write tools) with the specialist's brief and acceptance criteria, then the
#     specialist again (read only) to check them; one report on the item. Model access, one of:
#       - Amazon Bedrock: TRACE_AWS_ROLE (with Bedrock access) and TRACE_AWS_REGION;
#       - the Anthropic API: secret ANTHROPIC_API_KEY.
#     Memory (optional): TRACE_MEMORY_ID (the project's AgentCore memory) with TRACE_AWS_ROLE allowed to use it; the
#     agents then recall and record as they do on AgentCore.
# Knowledge base (optional): with TRACE_KB_ID and TRACE_KB_DATA_SOURCE_ID (set by `trace install`), every push to
# __TR_BRANCH__ syncs the project's knowledge base (job kb-sync: `trace kb sync` through TRACE_AWS_ROLE), whatever
# worker.runner says; in the actions runner the agents also get kb_search and kb_status.
# Also needs TRACE_TOKEN. An hourly schedule runs the pick as a backstop for events GitHub never sent.
# Kill switch: variable TRACE_WORKER = 'false'.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account),
# never on a GitHub-hosted runner. The first runs-on label names the project's CodeBuild runner project through the
# repository variable TRACE_CODEBUILD_PROJECT, which `trace install` sets; the second keeps each job's runner distinct.
# Without that variable the jobs wait in the queue: there is no GitHub-hosted fallback, by design.
name: trace-worker

on:
  workflow_run:
    workflows: [trace-ci]
    types: [completed]
  issues:
    types: [labeled]
  push:
    branches: [__TR_BRANCH__]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: trace-worker-pick
  cancel-in-progress: false

jobs:
  # the project's knowledge base follows the default branch: changed documents only, then an ingestion job
  kb-sync:
    if: >-
      vars.TRACE_WORKER != 'false' && github.event_name == 'push' && vars.TRACE_KB_ID != '' && vars.TRACE_AWS_ROLE != ''
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - kb-sync
    timeout-minutes: 30
    concurrency: { group: trace-kb-sync, cancel-in-progress: false }
    permissions:
      id-token: write          # GitHub OIDC -> TRACE_AWS_ROLE (projects/<slug>/kb/ in S3, its knowledge base's ingestion)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_AWS_ROLE }}
          role-session-name: trace-kb-sync-${{ github.run_id }}
          aws-region: ${{ vars.TRACE_AWS_REGION || 'us-east-1' }}
      - uses: __TR_SOURCE__/harness/actions/install@__TR_REF__
        with:
          bridge: none
      - name: Sync the knowledge base
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}
          TRACE_KB_ID: ${{ vars.TRACE_KB_ID }}
          TRACE_KB_DATA_SOURCE_ID: ${{ vars.TRACE_KB_DATA_SOURCE_ID }}
        run: trace kb sync --wait 20

  pick:
    if: >-
      vars.TRACE_WORKER != 'false' &&
      (github.event_name != 'issues' || github.event.label.name == '__TR_AGENT_FIX__')
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - pick
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
      contents: read
    outputs:
      items: ${{ steps.pick.outputs.items }}
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: worker-pick

  dispatch:
    name: "dispatch #${{ matrix.item.number }} (${{ matrix.item.route.kind || 'routed by the runtime' }})"
    needs: pick
    if: >-
      needs.pick.outputs.items != '' && needs.pick.outputs.items != '[]' &&
      (needs.pick.outputs.runner == 'agentcore' || needs.pick.outputs.runner == '')
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.pick.outputs.items) }}
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - dispatch-${{ matrix.item.number }}
    timeout-minutes: 5
    permissions:
      id-token: write          # GitHub OIDC -> TRACE_AWS_ROLE (bedrock-agentcore:InvokeAgentRuntime)
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_AWS_ROLE }}
          role-session-name: trace-dispatch-${{ github.run_id }}-${{ matrix.item.number }}
          aws-region: ${{ vars.TRACE_AWS_REGION || 'us-east-1' }}
      - id: dispatch
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: worker-dispatch
          item: ${{ toJSON(matrix.item) }}
          agent: ${{ matrix.item.route.kind }}
          runtime-arn: ${{ vars.TRACE_AGENT_RUNTIME_ARN }}

  work:
    name: "work #${{ matrix.item.number }} (${{ matrix.item.route.kind || 'default specialist' }})"
    needs: pick
    if: needs.pick.outputs.items != '' && needs.pick.outputs.items != '[]' && needs.pick.outputs.runner == 'actions'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.pick.outputs.items) }}
    concurrency:
      group: trace-work-${{ matrix.item.number }}
      cancel-in-progress: false
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - work-${{ matrix.item.number }}
    timeout-minutes: 150
    permissions:
      id-token: write          # GitHub OIDC -> TRACE_AWS_ROLE (Bedrock), when set
      contents: read           # pushes use TRACE_TOKEN, so they start the build
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.item.ref || '__TR_BRANCH__' }}
          fetch-depth: 300
          token: ${{ secrets.TRACE_TOKEN }}
      - name: Fetch __TR_BRANCH__ too
        run: git fetch --depth=300 origin '+refs/heads/__TR_BRANCH__:refs/remotes/origin/__TR_BRANCH__'
      # First, so the specialist's memory is recalled with this role (and Bedrock, when used, is reachable).
      - if: vars.TRACE_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_AWS_ROLE }}
          role-session-name: trace-${{ github.run_id }}-${{ matrix.item.number }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.TRACE_AWS_REGION || 'us-east-1' }}
      - id: prompt
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}       # the installation's prompt overrides are read beside it
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: worker-prompt
          item: ${{ toJSON(matrix.item) }}
          agent: ${{ matrix.item.route.kind }}
          hardware: ${{ vars.TRACE_HARDWARE == 'true' && 'true' || 'false' }}
          memory-id: ${{ vars.TRACE_MEMORY_ID }}
      - id: tools
        uses: __TR_SOURCE__/harness/actions/install@__TR_REF__
        with:
          hardware: ${{ vars.TRACE_HARDWARE == 'true' && 'true' || 'false' }}
          tools: ${{ steps.prompt.outputs.tools }}
          memory-id: ${{ vars.TRACE_MEMORY_ID }}
          kb-id: ${{ vars.TRACE_KB_ID }}
          kb-data-source-id: ${{ vars.TRACE_KB_DATA_SOURCE_ID }}
          memory-actor: ${{ steps.prompt.outputs.memory-actor }}
          worker-memory-actor: ${{ steps.prompt.outputs.worker-memory-actor }}
          memory-session: ${{ steps.prompt.outputs.memory-session }}
      - name: Project setup (worker.setup)
        if: steps.prompt.outputs.setup != ''
        env:
          SETUP: ${{ steps.prompt.outputs.setup }}
        run: bash -euo pipefail -c "$SETUP"
      - name: Git identity for commits
        run: |
          git config user.name "trace worker (Claude)"
          git config user.email "noreply@anthropic.com"
      # 1. The specialist: read only (no Bash, Write, Edit or Task; only its own trace tools). It ends with a
      #    structured output: its report, and whether the worker should change the repository (brief, criteria).
      - id: specialist
        name: "Specialist: ${{ steps.prompt.outputs.agent }} (read only)"
        continue-on-error: true
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          use_bedrock: ${{ vars.TRACE_AWS_ROLE != '' && 'true' || 'false' }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TRACE_TOKEN }}
          # The upstream run (ci-doctor) can be started by Dependabot's or the workflows' own runs.
          allowed_bots: "dependabot[bot],github-actions[bot]"
          claude_args: |
            ${{ steps.prompt.outputs.args }}
            --mcp-config '${{ steps.tools.outputs.mcp-config }}'
          prompt: ${{ steps.prompt.outputs.prompt }}
      - id: delegate
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' }}
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: worker-delegate
          item: ${{ toJSON(matrix.item) }}
          agent: ${{ steps.prompt.outputs.agent }}
          hardware: ${{ vars.TRACE_HARDWARE == 'true' && 'true' || 'false' }}
          memory-id: ${{ vars.TRACE_MEMORY_ID }}
          specialist: ${{ steps.specialist.outputs.structured_output }}
          execution-file: ${{ steps.specialist.outputs.execution_file }}
      # 2. The worker, only when the specialist delegated: the worker's tools (shell, edits, git), its own prompt with
      #    the specialist's brief and acceptance criteria as its request.
      - id: worker
        name: Worker (delegated)
        if: ${{ !cancelled() && steps.delegate.outputs.delegate == 'true' }}
        continue-on-error: true
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          use_bedrock: ${{ vars.TRACE_AWS_ROLE != '' && 'true' || 'false' }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TRACE_TOKEN }}
          allowed_bots: "dependabot[bot],github-actions[bot]"
          claude_args: |
            ${{ steps.delegate.outputs.args }}
            --mcp-config '${{ steps.tools.outputs.mcp-config-worker }}'
          prompt: ${{ steps.delegate.outputs.prompt }}
      - name: Keep the worker's transcript
        if: ${{ !cancelled() && steps.worker.outputs.execution_file != '' }}
        env:
          FROM: ${{ steps.worker.outputs.execution_file }}
        run: cp "$FROM" "$RUNNER_TEMP/trace-worker-execution.json"
      # 3. The check: the specialist again, read only, checks each acceptance criterion with its own tools.
      - id: check
        name: "Check: ${{ steps.prompt.outputs.agent }} (read only)"
        if: ${{ !cancelled() && steps.delegate.outputs.delegate == 'true' }}
        continue-on-error: true
        env:
          TRACE_HOME: ${{ vars.TRACE_HOME }}
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          use_bedrock: ${{ vars.TRACE_AWS_ROLE != '' && 'true' || 'false' }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TRACE_TOKEN }}
          allowed_bots: "dependabot[bot],github-actions[bot]"
          claude_args: |
            ${{ steps.delegate.outputs.check-args }}
            --mcp-config '${{ steps.tools.outputs.mcp-config }}'
          prompt: ${{ steps.delegate.outputs.check-prompt }}
      - id: report
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' }}
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: worker-report
          item: ${{ toJSON(matrix.item) }}
          agent: ${{ steps.prompt.outputs.agent }}
          memory-id: ${{ vars.TRACE_MEMORY_ID }}
          specialist: ${{ steps.specialist.outputs.structured_output }}
          check: ${{ steps.check.outputs.structured_output }}
          worker-conclusion: ${{ steps.worker.outputs.conclusion }}
          worker-execution-file: ${{ steps.worker.outputs.execution_file != '' && format('{0}/trace-worker-execution.json', runner.temp) || '' }}
          execution-file: ${{ steps.check.outputs.execution_file }}
