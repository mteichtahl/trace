# trace — deploys (generated by `trace onboard`). Off until deploy.enabled is true in .trace/config.yml.
#
#   1. "__TR_BUILD_NAME__" passes on __TR_BRANCH__: one "Deploy to __TR_ENVIRONMENT__" issue opens (or moves to the
#      newer commit). With deploy.auto it deploys at once; otherwise it waits for /approve.
#   2. Before anything changes: refuse if __TR_ENVIRONMENT__ already runs a newer commit. For an automatic deploy,
#      run deploy.risk_check: exit 0 deploys, anything else holds the request (label __TR_DEPLOY_HELD__) for a person.
#   3. deploy.command, then deploy.smoke. If either fails after the deploy began, the rollback job puts back the
#      commit that ran before (deploy.rollback, or deploy.command + deploy.smoke on that commit).
#   4. /approve and /reject on the request: only a PERSON with admin or maintain (and in deploy.approvers when set);
#      bots and apps are always refused, so the agents that write the code never send it to __TR_ENVIRONMENT__.
#
# The commands run with DEPLOY_SHA and DEPLOY_ENVIRONMENT set, and with the environment's and repository's secrets as
# environment variables. Cloud credentials: variable TRACE_DEPLOY_AWS_ROLE (GitHub OIDC, environment
# __TR_ENVIRONMENT__) and TRACE_DEPLOY_AWS_REGION, or your own secrets. Kill switch: TRACE_DEPLOY = 'false'.
name: trace-deploy

on:
  workflow_run:
    workflows: ["__TR_BUILD_NAME__"]
    types: [completed]
    branches: [__TR_BRANCH__]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  request:
    if: >-
      vars.TRACE_DEPLOY != 'false' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: __TR_RUNS_ON__
    timeout-minutes: 5
    concurrency: { group: trace-deploy-request, cancel-in-progress: false }
    permissions:
      issues: write
      contents: read
      actions: read
    outputs:
      go: ${{ steps.ask.outputs.go }}
      sha: ${{ steps.ask.outputs.sha }}
      issue: ${{ steps.ask.outputs.issue }}
    steps:
      - id: ask
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-request

  approve:
    if: >-
      vars.TRACE_DEPLOY != 'false' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, '__TR_DEPLOY__') && github.event.issue.state == 'open' &&
       (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject'))))
    runs-on: __TR_RUNS_ON__
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
      sha: ${{ steps.check.outputs.sha }}
      issue: ${{ steps.check.outputs.issue }}
      by: ${{ steps.check.outputs.by }}
    steps:
      - id: check
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-approve
          triggering-actor: ${{ github.triggering_actor }}

  deploy:
    name: deploy to __TR_ENVIRONMENT__
    needs: [request, approve]
    if: always() && (needs.request.outputs.go == 'true' || needs.approve.outputs.go == 'true')
    concurrency: { group: trace-deploy-__TR_ENVIRONMENT__, cancel-in-progress: false }
    environment: __TR_ENVIRONMENT__
    runs-on: __TR_RUNS_ON_BENCH__
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
      issues: write
      actions: read
    outputs:
      rollback: ${{ steps.rollback.outputs.to }}
      issue: ${{ env.ISSUE }}
    env:
      SHA: ${{ needs.request.outputs.go == 'true' && needs.request.outputs.sha || needs.approve.outputs.sha }}
      ISSUE: ${{ needs.request.outputs.go == 'true' && needs.request.outputs.issue || needs.approve.outputs.issue }}
      AUTO: ${{ needs.request.outputs.go == 'true' }}
      BY: ${{ needs.request.outputs.go == 'true' && 'the pipeline (automatic deploy)' || format('@{0}', needs.approve.outputs.by) }}
      DEPLOY_ENVIRONMENT: __TR_ENVIRONMENT__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - id: cmd
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-commands
      # The job may start long after the approval (a busy runner): check again, now, before touching anything.
      - id: guard
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-guard
          sha: ${{ env.SHA }}
          issue: ${{ env.ISSUE }}
      - name: Secrets as environment variables for the commands
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          printf '%s' "$ALL" | python3 -c '
          import json, os, sys, uuid
          skip = {"github_token", "TRACE_TOKEN"}
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in json.load(sys.stdin).items():
                  if k in skip or not k.replace("_", "").isalnum(): continue
                  d = "AP_" + uuid.uuid4().hex
                  f.write(f"{k}<<{d}\n{v}\n{d}\n")'
      - if: vars.TRACE_DEPLOY_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_DEPLOY_AWS_ROLE }}
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.TRACE_DEPLOY_AWS_REGION || 'us-east-1' }}
      - name: deploy.setup
        if: steps.cmd.outputs.setup != ''
        env: { CMD: '${{ steps.cmd.outputs.setup }}', DEPLOY_SHA: '${{ env.SHA }}' }
        run: bash -euo pipefail -c "$CMD"
      # Automatic deploys only: a person's /approve has already judged the change.
      - name: deploy.risk_check
        id: gate
        if: env.AUTO == 'true' && steps.cmd.outputs.risk_check != ''
        env: { CMD: '${{ steps.cmd.outputs.risk_check }}', DEPLOY_SHA: '${{ env.SHA }}' }
        run: |
          set +e
          out=$(bash -euo pipefail -c "$CMD" 2>&1); code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            d="AP_$(date +%s%N)"; { echo "reasons<<$d"; printf '%s\n' "$out" | tail -n 40; echo "$d"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Hold for a person
        if: steps.gate.outputs.hold == 'true'
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-hold
          sha: ${{ env.SHA }}
          issue: ${{ env.ISSUE }}
          reasons: ${{ steps.gate.outputs.reasons }}
      - name: deploy.command
        id: apply
        if: steps.gate.outputs.hold != 'true'
        env: { CMD: '${{ steps.cmd.outputs.command }}', DEPLOY_SHA: '${{ env.SHA }}' }
        run: bash -euo pipefail -c "$CMD"
      - name: deploy.smoke
        id: smoke
        if: steps.gate.outputs.hold != 'true' && steps.cmd.outputs.smoke != ''
        env: { CMD: '${{ steps.cmd.outputs.smoke }}', DEPLOY_SHA: '${{ env.SHA }}' }
        run: bash -euo pipefail -c "$CMD"
      - name: Roll back?
        id: rollback
        if: >-
          failure() && (steps.apply.outcome == 'failure' || steps.smoke.outcome == 'failure') &&
          steps.guard.outputs.before != '' && steps.guard.outputs.before != env.SHA
        env: { BEFORE: '${{ steps.guard.outputs.before }}' }
        run: echo "to=$BEFORE" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-report
          sha: ${{ env.SHA }}
          issue: ${{ env.ISSUE }}
          by: ${{ env.BY }}
          status: ${{ job.status }}
          guard: ${{ steps.guard.outcome }}
          held: ${{ steps.gate.outputs.hold }}
          rollback-to: ${{ steps.rollback.outputs.to }}

  rollback:
    name: roll __TR_ENVIRONMENT__ back
    needs: deploy
    if: always() && needs.deploy.outputs.rollback != ''
    concurrency: { group: trace-deploy-__TR_ENVIRONMENT__, cancel-in-progress: false }
    environment: __TR_ENVIRONMENT__
    runs-on: __TR_RUNS_ON_BENCH__
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
      issues: write
    env:
      SHA: ${{ needs.deploy.outputs.rollback }}
      ISSUE: ${{ needs.deploy.outputs.issue }}
      DEPLOY_ENVIRONMENT: __TR_ENVIRONMENT__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - id: cmd
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: deploy-commands
      - name: Secrets as environment variables for the commands
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          printf '%s' "$ALL" | python3 -c '
          import json, os, sys, uuid
          skip = {"github_token", "TRACE_TOKEN"}
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in json.load(sys.stdin).items():
                  if k in skip or not k.replace("_", "").isalnum(): continue
                  d = "AP_" + uuid.uuid4().hex
                  f.write(f"{k}<<{d}\n{v}\n{d}\n")'
      - if: vars.TRACE_DEPLOY_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_DEPLOY_AWS_ROLE }}
          role-session-name: rollback-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.TRACE_DEPLOY_AWS_REGION || 'us-east-1' }}
      - name: deploy.setup
        if: steps.cmd.outputs.setup != ''
        env: { CMD: '${{ steps.cmd.outputs.setup }}', DEPLOY_SHA: '${{ env.SHA }}' }
        run: bash -euo pipefail -c "$CMD"
      - name: deploy.rollback (or deploy.command and deploy.smoke on the earlier commit)
        env:
          ROLLBACK: ${{ steps.cmd.outputs.rollback }}
          COMMAND: ${{ steps.cmd.outputs.command }}
          SMOKE: ${{ steps.cmd.outputs.smoke }}
          DEPLOY_SHA: ${{ env.SHA }}
          ROLLBACK_SHA: ${{ env.SHA }}
        run: |
          if [ -n "$ROLLBACK" ]; then bash -euo pipefail -c "$ROLLBACK"; exit; fi
          bash -euo pipefail -c "$COMMAND"
          if [ -n "$SMOKE" ]; then bash -euo pipefail -c "$SMOKE"; fi
      - name: Report
        if: always()
        uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          agent-login: ${{ vars.TRACE_AGENT_LOGIN }}
          task: rollback-report
          sha: ${{ env.SHA }}
          issue: ${{ env.ISSUE }}
          status: ${{ job.status }}
