# trace — CI doctor (generated by `tracectl onboard`).
#
# Every finished run of "__TR_BUILD_NAME__": flaky failures are re-run once; real ones label the PR __TR_CI_RED__
# or open an __TR_AGENT_FIX__ issue for the worker; a pass clears both. Kill switch: variable TRACE_CI = 'false'.
# It acts as trace's GitHub app when its token broker is set up for this repository (TRACE_GITHUB_APP_BROKER,
# TRACE_GITHUB_APP_ROLE), else as TRACE_TOKEN (templates/workflows/trace-prs.yml says why).
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account)
# once `tracectl install` has set it up, and on GitHub's ubuntu-24.04 runners until then. The switch is the repository
# variable TRACE_CODEBUILD_PROJECT, which the installer sets only once the runner project exists (and removes if it
# does not): set, runs-on names that project (codebuild-<project>-<run id>-<attempt>) and a label that keeps each
# job's runner distinct; unset, ubuntu-24.04. Nothing in the workflow changes when the runner arrives.
name: trace-ci

on:
  workflow_run:
    workflows: ["__TR_BUILD_NAME__"]
    types: [completed]

permissions: {}

jobs:
  ci-doctor:
    if: >-
      vars.TRACE_CI != 'false' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","ci-doctor"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    concurrency: { group: 'trace-ci-${{ github.event.workflow_run.head_branch }}', cancel-in-progress: false }
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: read
      id-token: write          # GitHub OIDC -> TRACE_GITHUB_APP_ROLE (asks the token broker for trace's GitHub app's token)
    steps:
      # trace's GitHub app (its own rate limit): AWS credentials from the repository's token role, to ask the broker
      # with. Left out, or refused, the step acts as TRACE_TOKEN (src/harness/app-token.ts)
      - if: vars.TRACE_GITHUB_APP_BROKER != '' && vars.TRACE_GITHUB_APP_ROLE != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TRACE_GITHUB_APP_ROLE }}
          role-session-name: trace-ci-doctor-${{ github.run_id }}
          aws-region: ${{ vars.TRACE_AWS_REGION || 'us-east-1' }}
      - uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          task: ci-doctor
          token: ${{ secrets.TRACE_TOKEN }}
          broker-url: ${{ vars.TRACE_GITHUB_APP_BROKER }}
