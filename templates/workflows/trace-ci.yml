# trace — CI doctor (generated by `trace onboard`).
#
# Every finished run of "__TR_BUILD_NAME__": flaky failures are re-run once; real ones label the PR __TR_CI_RED__
# or open an __TR_AGENT_FIX__ issue for the worker; a pass clears both. Kill switch: variable TRACE_CI = 'false'.
name: trace-ci

on:
  workflow_run:
    workflows: ["__TR_BUILD_NAME__"]
    types: [completed]

permissions: {}

jobs:
  ci-doctor:
    if: >-
      vars.TRACE_CI != 'false' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - ci-doctor
    timeout-minutes: 10
    concurrency: { group: 'trace-ci-${{ github.event.workflow_run.head_branch }}', cancel-in-progress: false }
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          task: ci-doctor
          token: ${{ secrets.TRACE_TOKEN }}
