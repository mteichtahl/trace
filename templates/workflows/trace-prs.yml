# trace — pull requests (generated by `tracectl onboard`; re-generate with `tracectl onboard --refresh`).
#
#   open-pr       a pushed branch gets its pull request; a branch built on another open PR's branch is stacked on it
#                 (its PR targets that branch, so it shows only its own commits: docs/stacked-changes.md)
#   automerge     every PR to __TR_BRANCH__ merges itself once its required check passes (label __TR_HOLD__ holds it);
#                 a stacked PR waits, and gets auto-merge when its base merges and it is moved onto __TR_BRANCH__
#   update-queue  first the stacks are kept in order (a PR whose base merged moves onto __TR_BRANCH__; one whose base
#                 moved on gets it merged in; one whose base closed unmerged is held); then trace's own PRs whose only conflict is .trace/project.db get __TR_BRANCH__ merged in (the database
#                 merged as the trace-db driver does); then the oldest auto-merge PR that is behind __TR_BRANCH__ is
#                 brought up to date, one at a time
#
# Behaviour is set in .trace/config.yml (read from __TR_BRANCH__, never from a PR). Kill switch: repository
# variable TRACE_PRS = 'false'. Needs the TRACE_TOKEN secret for its actions to start builds.
#
# Who it acts as: trace's GitHub app, when the installer has set the TRACE_APP_ID variable and TRACE_APP_KEY secret and
# the app is installed on this repository: each job gets a token for this repository alone, on the app's own rate
# limit, so busy hours no longer use up the quota of the person whose token TRACE_TOKEN is. Otherwise, and for opening
# a pull request (trace knows its changes by the login that opened them, TRACE_AGENT_LOGIN), TRACE_TOKEN.
#
# How work is found: events. A push to a branch opens its PR; a PR opened, reopened, made ready, retargeted or
# (un)labelled gets auto-merge; a push to __TR_BRANCH__ (a merge, which leaves other PRs behind) moves the update
# queue on, and so does every finished __TR_BUILD_NAME__ run (a head PR whose build failed is not merged, so no push
# follows: the finished build is the event that moves the queue past it). Runs of update-queue never overlap
# (concurrency group trace-update-queue), and a finished build with nothing to do costs one short run. The schedule
# (minutes 17 and 47 of every hour, UTC) is only a safety net and runs update-queue alone: it catches a queue left
# standing when GitHub failed to deliver one of those events.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account)
# once `tracectl install` has set it up, and on GitHub's ubuntu-24.04 runners until then. The switch is the repository
# variable TRACE_CODEBUILD_PROJECT, which the installer sets only once the runner project exists (and removes if it
# does not): set, runs-on names that project (codebuild-<project>-<run id>-<attempt>) and a label that keeps each
# job's runner distinct; unset, ubuntu-24.04. Nothing in the workflow changes when the runner arrives.
name: trace-prs

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, ready_for_review, edited, labeled, unlabeled]
    branches: [__TR_BRANCH__]
  workflow_run:
    workflows: ["__TR_BUILD_NAME__"]
    types: [completed]           # a finished build moves the update queue on (see the header)
  schedule:
    - cron: '17,47 * * * *'    # safety net only: twice an hour, update-queue alone (see the header)
  workflow_dispatch:

permissions: {}

jobs:
  open-pr:
    if: vars.TRACE_PRS != 'false' && github.event_name == 'push' && github.ref != 'refs/heads/__TR_BRANCH__'
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","open-pr"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    concurrency: { group: 'trace-open-${{ github.ref }}', cancel-in-progress: false }
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          task: open-pr
          token: ${{ secrets.TRACE_TOKEN }}
          app-id: ${{ vars.TRACE_APP_ID }}
          app-key: ${{ secrets.TRACE_APP_KEY }}

  automerge:
    if: vars.TRACE_PRS != 'false' && github.event_name == 'pull_request'
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","automerge"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    concurrency: { group: 'trace-automerge-${{ github.event.pull_request.number }}', cancel-in-progress: true }
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          task: automerge
          token: ${{ secrets.TRACE_TOKEN }}
          app-id: ${{ vars.TRACE_APP_ID }}
          app-key: ${{ secrets.TRACE_APP_KEY }}

  update-queue:
    if: >-
      vars.TRACE_PRS != 'false' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/__TR_BRANCH__'))
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","update-queue"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    concurrency: { group: trace-update-queue, cancel-in-progress: false }
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: __TR_SOURCE__/harness/actions/run@__TR_REF__
        with:
          task: update-queue
          token: ${{ secrets.TRACE_TOKEN }}
          app-id: ${{ vars.TRACE_APP_ID }}
          app-key: ${{ secrets.TRACE_APP_KEY }}
