# The build, generated by trace (Rust). "tests pass" is the check the default branch
# requires; add your own jobs and list them under its `needs`.
name: build

on:
  push:
    branches: [__TR_BRANCH__]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: __TR_RUNS_ON__
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show && rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  tests-pass:
    name: tests pass
    if: always()
    needs: [check]
    runs-on: __TR_RUNS_ON__
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
