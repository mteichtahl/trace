# The build, generated by trace for a repository that had none. "tests pass" is the check the default branch
# requires; add your own jobs and list them under its `needs`.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account),
# never on a GitHub-hosted runner. The first runs-on label names the project's CodeBuild runner project through the
# repository variable TRACE_CODEBUILD_PROJECT, which `trace install` sets; the second keeps each job's runner distinct.
# Without that variable the jobs wait in the queue: there is no GitHub-hosted fallback, by design.
name: build

on:
  push:
    branches: [__TR_BRANCH__]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing to build yet
        run: echo "Add the repository's build and tests here."

  tests-pass:
    name: tests pass
    if: always()
    needs: [check]
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - tests-pass
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
