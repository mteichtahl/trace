# The build, generated by trace (hardware: KiCad and firmware). "tests pass" is the check the default branch
# requires; add your own jobs and list them under its `needs`.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account)
# once `tracectl install` has set it up, and on GitHub's ubuntu-24.04 runners until then. The switch is the repository
# variable TRACE_CODEBUILD_PROJECT, which the installer sets only once the runner project exists (and removes if it
# does not): set, runs-on names that project (codebuild-<project>-<run id>-<attempt>) and a label that keeps each
# job's runner distinct; unset, ubuntu-24.04. Nothing in the workflow changes when the runner arrives.
name: build

on:
  push:
    branches: [__TR_BRANCH__]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","check"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KiCad, ngspice and Icarus Verilog
        run: |
          # The PPA by its signing key and address. add-apt-repository first asks Launchpad's API for both, and on the
          # build runners that call hung for 18 minutes and then failed, twice (test-esp32-run3 S25).
          . /etc/os-release
          KEY=FDA854F61C4D0D9572BB95E5245D5502FAD7A805
          sudo install -d -m 0755 /etc/apt/keyrings
          for i in 1 2 3; do
            curl -fsSL --max-time 30 "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$KEY" -o /tmp/kicad.asc && break
            [ "$i" = 3 ] && { echo "could not fetch the KiCad PPA's key"; exit 1; }; sleep 10
          done
          sudo gpg --dearmor --yes -o /etc/apt/keyrings/kicad.gpg /tmp/kicad.asc
          echo "deb [signed-by=/etc/apt/keyrings/kicad.gpg] https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu $VERSION_CODENAME main" | sudo tee /etc/apt/sources.list.d/kicad.list
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends kicad ngspice iverilog
      - uses: __TR_SOURCE__/harness/actions/install@__TR_REF__
      # The enclosure engine, only when the repository has a case (mechanical/case.json): build123d into the venv the
      # install step made for trace's Python package (TRACE_PYTHON), which already holds tracebridge and its mech module.
      - name: Enclosure engine (build123d)
        if: hashFiles('mechanical/case.json') != '' && !github.event.pull_request.head.repo.fork
        run: '"$TRACE_PYTHON" -m pip install -q "build123d==0.13.0"'
      # ERC and DRC on every KiCad project, a build of every firmware target, and the case's fit check when there is
      # a case (tracectl check). The case script (mechanical/case.py) is code: in CI the check builds the case only
      # when TRACE_CHECK_MECH is 1 (unset, it skips the case and says so), which this sets for pushes and for pull
      # requests from this repository, and never for a fork's (0, with the reason), so a fork's script never runs on
      # this repository's runner.
      - run: tracectl check
        env:
          TRACE_CHECK_MECH: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
          TRACE_CHECK_MECH_WHY: ${{ github.event.pull_request.head.repo.fork && 'pull request from a fork runs no case script' || '' }}

  tests-pass:
    name: tests pass
    if: always()
    needs: [check]
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","tests-pass"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
