# The build, generated by trace (hardware: KiCad and firmware). "tests pass" is the check the default branch
# requires; add your own jobs and list them under its `needs`.
name: build

on:
  push:
    branches: [__TR_BRANCH__]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KiCad, ngspice and Icarus Verilog
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends kicad ngspice iverilog
      - uses: __TR_SOURCE__/harness/actions/install@__TR_REF__
      # ERC and DRC on every KiCad project, and a build of every firmware target (trace check).
      - run: trace check

  tests-pass:
    name: tests pass
    if: always()
    needs: [check]
    runs-on:
      - codebuild-${{ vars.TRACE_CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - tests-pass
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
