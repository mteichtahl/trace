# The build, generated by trace (Python). "tests pass" is the check the default branch
# requires; add your own jobs and list them under its `needs`.
#
# Runners: every job runs on AWS CodeBuild (a CodeBuild-hosted GitHub Actions runner in the installation's AWS account)
# once `tracectl install` has set it up, and on GitHub's ubuntu-24.04 runners until then. The switch is the repository
# variable TRACE_CODEBUILD_PROJECT, which the installer sets only once the runner project exists (and removes if it
# does not): set, runs-on names that project (codebuild-<project>-<run id>-<attempt>) and a label that keeps each
# job's runner distinct; unset, ubuntu-24.04. Nothing in the workflow changes when the runner arrives.
name: build

on:
  push:
    branches: [__TR_BRANCH__]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","check"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]' || pip install -e . pytest
      - run: python -m pytest -q

  tests-pass:
    name: tests pass
    if: always()
    needs: [check]
    runs-on: ${{ vars.TRACE_CODEBUILD_PROJECT && fromJSON(format('["codebuild-{0}-{1}-{2}","tests-pass"]', vars.TRACE_CODEBUILD_PROJECT, github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended $r"; exit 1; }; done
